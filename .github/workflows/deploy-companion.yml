name: Deploy Participant Companion

on:
  push:
    branches: [main, master]
    paths:
      - 'participant-companion/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: participant-companion/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: participant-companion

      - name: Build
        run: npm run build
        working-directory: participant-companion

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: participant-companion/dist
          destination_dir: companion
          keep_files: true
